<!DOCTYPE html>
<html>

<head>

    <title>Trekking Management System</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div id="navbarApp">

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

            <div class="container-fluid">

                <a class="navbar-brand" href="/">
                    Trekking App
                </a>

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            Home
                        </a>
                    </li>

                    <!-- Admin -->

                    <template v-if="user && user.role === 'admin'">

                        <li class="nav-item">
                            <a class="nav-link" href="/admin/dashboard">
                                Dashboard
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/admin/create-trek">
                                Create Trek
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/admin/treks-page">
                                Treks
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/admin/add-staff">
                                Add Staff
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/admin/staff-page">
                                Staff
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/admin/users-page">
                                Users
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/admin/bookings-page">
                                Bookings
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#" @click="logout">
                                Logout
                            </a>
                        </li>

                    </template>

                    <!-- Staff -->

                    <template v-else-if="user && user.role === 'staff'">

                        <li class="nav-item">
                            <a class="nav-link" href="/staff/dashboard">
                                Dashboard
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/staff/treks-page">
                                My Treks
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#" @click="logout">
                                Logout
                            </a>
                        </li>

                    </template>

                    <!-- User -->

                    <template v-else-if="user && user.role === 'user'">

                        <li class="nav-item">
                            <a class="nav-link" href="/user/dashboard">
                                Dashboard
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/user/treks-page">
                                Browse Treks
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/user/bookings-page">
                                My Bookings
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/user/profile-page">
                                Profile
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" @click="logout">
                                Logout
                            </a>
                        </li>

                    </template>

                    <!-- Guest -->

                    <template v-else>

                        <li class="nav-item">
                            <a class="nav-link" href="/login">
                                Login
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/register">
                                Register
                            </a>
                        </li>

                    </template>

                </ul>

            </div>

        </nav>

    </div>

    <div class="container mt-4">

        {% block content %}
        {% endblock %}

    </div>

    <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>

</body>

</html>
