{% extends "base.html" %}

{% block content %}

<div id="editTrekApp" class="container mt-4">

    <h2>Edit Trek</h2>

    <form @submit.prevent="updateTrek">

        <div class="mb-3">
            <label>Trek Name</label>
            <input type="text" class="form-control" v-model="name">
        </div>

        <div class="mb-3">
            <label>Location</label>
            <input type="text" class="form-control" v-model="location">
        </div>

        <div class="mb-3">
            <label>Difficulty</label>

            <select class="form-control" v-model="difficulty">
                <option>Easy</option>
                <option>Moderate</option>
                <option>Hard</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Duration</label>

            <input type="number" class="form-control" v-model="duration">
        </div>

        <div class="mb-3">
            <label>Available Slots</label>

            <input type="number" class="form-control" v-model="available_slots">
        </div>

        <div class="mb-3">
            <label>Description</label>

            <textarea class="form-control" v-model="description"></textarea>
        </div>
        <div class="mb-3">

            <label>Assign Staff</label>

            <select class="form-control" v-model="staff_id">

                <option value="">
                    Select Staff
                </option>

                <option v-for="staff in staffs" :key="staff.id" :value="staff.id" v-text="staff.name"></option>

            </select>

        </div>
        <button type="submit" class="btn btn-primary">
            Update Trek
        </button>

    </form>

</div>

<script src="{{ url_for('static', filename='js/edit_trek.js') }}"></script>

{% endblock %}
