{% extends "base.html" %}

{% block content %}

<div id="createTrekApp">

    <h2>Create Trek</h2>

    <form @submit.prevent="createTrek">

        <input type="text" class="form-control mb-2" placeholder="Trek Name" v-model="name">

        <input type="text" class="form-control mb-2" placeholder="Location" v-model="location">

        <select class="form-control mb-2" v-model="difficulty">
            <option value="">Select Difficulty</option>
            <option>Easy</option>
            <option>Moderate</option>
            <option>Hard</option>
        </select>

        <input type="number" class="form-control mb-2" placeholder="Duration (Days)" v-model="duration">

        <input type="number" class="form-control mb-2" placeholder="Available Slots" v-model="available_slots">

        <input type="date" class="form-control mb-2" v-model="start_date">

        <input type="date" class="form-control mb-2" v-model="end_date">

        <textarea class="form-control mb-2" placeholder="Description" v-model="description"></textarea>

        <div class="mb-3">

            <label>Assign Staff</label>

            <select class="form-control" v-model="staff_id">

                <option value="">
                    Select Staff
                </option>

                <option v-for="staff in staffs" :key="staff.id" :value="staff.id" v-text="staff.name"></option>

            </select>

        </div>

        <button class="btn btn-success">
            Create Trek
        </button>

    </form>

</div>

<script src="{{ url_for('static', filename='js/create_trek.js') }}"></script>

{% endblock %}
