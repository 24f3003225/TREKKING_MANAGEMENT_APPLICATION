{% extends "base.html" %}

{% block content %}

<div id="slotsApp" class="container mt-4">

    <h2>
        Update Trek Slots
    </h2>

    <div class="mb-3">

        <label class="form-label">
            Available Slots
        </label>

        <input type="number" class="form-control" v-model="available_slots">

    </div>

    <button class="btn btn-primary" @click="updateSlots">
        Save
    </button>

</div>

<script src="{{ url_for('static', filename='js/update_slots.js') }}"></script>

{% endblock %}
