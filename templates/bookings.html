{% extends "base.html" %}

{% block content %}

<div id="bookingApp" class="container mt-4">

    <h2>All Bookings</h2>

    <table class="table table-bordered">

        <thead>

            <tr>

                <th>ID</th>
                <th>User</th>
                <th>Trek</th>
                <th>Booking Date</th>
                <th>Status</th>
                <th>Payment</th>

            </tr>

        </thead>

        <tbody>

            <tr v-for="booking in bookings" :key="booking.id">

                <td v-text="booking.id"></td>

                <td v-text="booking.user_name"></td>

                <td v-text="booking.trek_name"></td>

                <td v-text="booking.booking_date"></td>

                <td v-text="booking.status"></td>

                <td v-text="booking.payment_status"></td>

            </tr>

        </tbody>

    </table>

</div>

<script src="{{ url_for('static', filename='js/bookings.js') }}"></script>

{% endblock %}
