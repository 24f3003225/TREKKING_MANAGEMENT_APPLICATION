{% extends "base.html" %}

{% block content %}

<div id="profileApp" class="container mt-4">

    <h2>
        My Profile
    </h2>

    <div class="mb-3">

        <label>Name</label>

        <input type="text" class="form-control" v-model="name">

    </div>

    <div class="mb-3">

        <label>Email</label>

        <input type="email" class="form-control" v-model="email" readonly>

    </div>

    <div class="mb-3">

        <label>Phone</label>

        <input type="text" class="form-control" v-model="phone">

    </div>

    <button class="btn btn-primary" @click="updateProfile">
        Update Profile
    </button>

</div>

<script src="{{ url_for('static', filename='js/profile.js') }}"></script>

{% endblock %}
